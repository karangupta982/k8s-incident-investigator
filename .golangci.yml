run:
  timeout: 5m
  go: "1.23"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam

linters-settings:
  goimports:
    local-prefixes: github.com/k8s-incident-investigator

issues:
  exclude-rules:
    # Test files can use dot imports (Ginkgo/Gomega)
    - path: _test\.go
      linters:
        - golint
        - revive
    # Generated files are exempt
    - path: zz_generated
      linters:
        - all
  max-issues-per-linter: 50
  max-same-issues: 10
