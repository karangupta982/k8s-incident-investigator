apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8s-incident-investigator.fullname" . }}-manager-rolebinding
  labels:
    {{- include "k8s-incident-investigator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "k8s-incident-investigator.fullname" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "k8s-incident-investigator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
