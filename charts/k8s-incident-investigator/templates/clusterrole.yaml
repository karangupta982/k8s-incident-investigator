apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8s-incident-investigator.fullname" . }}-manager-role
  labels:
    {{- include "k8s-incident-investigator.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [pods, events, nodes]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [pods/log]
  verbs: [get]
- apiGroups: [""]
  resources: [persistentvolumeclaims, persistentvolumes]
  verbs: [get, list, watch]
- apiGroups: [storage.k8s.io]
  resources: [storageclasses]
  verbs: [get, list, watch]
- apiGroups: [apps]
  resources: [replicasets, deployments, statefulsets, daemonsets]
  verbs: [get, list, watch]
- apiGroups: [batch]
  resources: [jobs, cronjobs]
  verbs: [get, list, watch]
- apiGroups: [investigation.k8s.io]
  resources: [incidentreports]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [investigation.k8s.io]
  resources: [incidentreports/status]
  verbs: [get, update, patch]
- apiGroups: [investigation.k8s.io]
  resources: [incidentreports/finalizers]
  verbs: [update]
