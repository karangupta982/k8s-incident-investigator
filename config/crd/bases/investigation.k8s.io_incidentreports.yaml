---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    api-approved.kubernetes.io: unapproved, is a demo project for local development
    controller-gen.kubebuilder.io/version: v0.17.1
  name: incidentreports.investigation.k8s.io
spec:
  group: investigation.k8s.io
  names:
    categories:
    - investigator
    kind: IncidentReport
    listKind: IncidentReportList
    plural: incidentreports
    shortNames:
    - ir
    singular: incidentreport
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.workload.name
      name: Workload
      type: string
    - jsonPath: .spec.workload.kind
      name: Kind
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.trigger.type
      name: Trigger
      type: string
    - jsonPath: .status.startedAt
      name: Started
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: IncidentReport is the Schema for the incidentreports API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              IncidentReportSpec contains the immutable identity of the incident.
              Fields in spec are set at creation and not modified during the lifecycle.

              Note: The incident namespace is derived from metadata.namespace (standard Kubernetes
              convention for namespace-scoped resources). There is no spec.namespace field — storing
              the namespace in spec would create a second, potentially conflicting source of truth.
            properties:
              workload:
                description: |-
                  Workload is the workload associated with the incident.
                  Set when ownership can be resolved; may be empty if resolution failed.
                properties:
                  kind:
                    description: 'Kind is the workload type: Deployment, StatefulSet,
                      DaemonSet, Job, CronJob.'
                    type: string
                  name:
                    description: Name is the workload name.
                    type: string
                  namespace:
                    description: Namespace is the workload namespace.
                    type: string
                  uid:
                    description: UID is the workload UID, used to detect workload
                      replacement.
                    type: string
                required:
                - kind
                - name
                - namespace
                type: object
            type: object
          status:
            description: |-
              IncidentReportStatus holds the dynamic investigation state of the incident.
              Updated throughout the incident lifecycle via the status subresource.
            properties:
              affectedPods:
                description: |-
                  AffectedPods is the list of Pods associated with this incident.
                  Pods are appended; existing entries are preserved even after Pod deletion.
                items:
                  description: PodRef identifies a Pod affected by an incident.
                  properties:
                    name:
                      description: Name is the Pod name.
                      type: string
                    namespace:
                      description: Namespace is the Pod namespace.
                      type: string
                    uid:
                      description: UID is the Pod UID, used to distinguish replaced
                        Pods with the same name.
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                type: array
              conditions:
                description: Conditions provides standard Kubernetes condition semantics
                  for the incident state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              failureCount:
                description: |-
                  FailureCount tracks the number of distinct failure observations associated with this
                  incident. For state-based triggers, this increments only when a new unique failure
                  signature is observed (new container affected, or reoccurrence after recovery).
                  For event-based triggers, this is set to the current Kubernetes Event.count value.
                format: int32
                type: integer
              lastFailureAt:
                description: LastFailureAt records the time the most recent failure
                  was observed.
                format: date-time
                type: string
              phase:
                description: Phase is the current lifecycle state of the incident.
                enum:
                - Investigating
                - Diagnosed
                - Unknown
                - Resolved
                type: string
              resolvedAt:
                description: |-
                  ResolvedAt is the time the incident was resolved.
                  Set only when Phase = Resolved.
                format: date-time
                type: string
              stabilityStartedAt:
                description: |-
                  StabilityStartedAt records when the workload first became healthy after the incident.
                  Used to track the stability period without relying on in-memory state.
                  Reset to nil if a new failure occurs during the stability window.
                format: date-time
                type: string
              startedAt:
                description: StartedAt is the time the incident was first detected.
                format: date-time
                type: string
              trigger:
                description: Trigger is the primary failure signal that created the
                  incident.
                properties:
                  containerName:
                    description: ContainerName is the container that triggered the
                      incident, if applicable.
                    type: string
                  message:
                    description: Message is a short human-readable description of
                      the failure signal.
                    type: string
                  observedAt:
                    description: ObservedAt is the time at which this trigger was
                      first observed.
                    format: date-time
                    type: string
                  reason:
                    description: Reason is the raw Kubernetes reason string from the
                      Pod or Event, if available.
                    type: string
                  type:
                    description: Type is the classified trigger type.
                    type: string
                required:
                - type
                type: object
              workloadOwnerResolved:
                description: |-
                  WorkloadOwnerResolved indicates whether workload ownership was successfully determined.
                  False means the incident is tracked at Pod level (see AffectedPods).
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
